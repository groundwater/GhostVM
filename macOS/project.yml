name: GhostVM
options:
  bundleIdPrefix: org.ghostvm
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    from: "2.6.0"
  GhostHTTP:
    path: ../Packages/GhostHTTP
  SwiftCertificates:
    url: https://github.com/apple/swift-certificates.git
    from: "1.19.4"
  SwiftCrypto:
    url: https://github.com/apple/swift-crypto.git
    from: "3.15.1"
  Containerization:
    url: https://github.com/apple/containerization.git
    exactVersion: "0.40.1"

settings:
  base:
    ARCHS: arm64
    SWIFT_VERSION: "6.0"
    CLANG_ENABLE_OBJC_ARC: YES
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES
    CLANG_WARN_UNGUARDED_AVAILABILITY: YES

schemes:
  GhostVM:
    build:
      targets:
        GhostVM: all
  GhostVMTests:
    build:
      targets:
        GhostVMTests: test
    test:
      targets:
        - GhostVMTests
  GhostFile:
    build:
      targets:
        GhostFile: all
    run:
      config: Debug
  GhostFileTests:
    build:
      targets:
        GhostFileTests: test
    test:
      targets:
        - GhostFileTests

aggregateTargets:
  GhostHTTP3Framework:
    settings:
      base:
        PRODUCT_NAME: GhostHTTP3Framework
    buildScripts:
      - name: Build GhostHTTP3 arm64 framework
        runOnlyWhenInstalling: false
        showEnvVars: false
        outputFiles:
          - $(SRCROOT)/GhostHTTP3/.build/artifacts/GhostHTTP3.framework/Versions/A/GhostHTTP3
        script: |
          set -euo pipefail
          "${SRCROOT}/GhostHTTP3/scripts/ensure-framework.sh"

targets:
  GhostFileFS:
    type: extensionkit-extension
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: GhostFileFS
        excludes:
          - "*.plist"
      - path: GhostFileShared
    dependencies:
      - sdk: FSKit.framework
      - sdk: ExtensionFoundation.framework
      - sdk: Network.framework
      - sdk: Security.framework
      - target: GhostHTTP3Framework
      - framework: GhostHTTP3/.build/artifacts/GhostHTTP3.framework
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_NAME: GhostFileFS
        PRODUCT_BUNDLE_IDENTIFIER: org.ghostvm.ghostfile.fs
        SKIP_INSTALL: YES
        INFOPLIST_FILE: GhostFileFS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: GhostFileFS/entitlements.plist
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "5.0"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"

  GhostFile:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: GhostFile
        excludes:
          - "*.plist"
      - path: GhostFileShared
      - path: GhostFileFS/GhostFileHTTPClient.swift
    dependencies:
      - package: GhostHTTP
      - package: SwiftCertificates
        product: X509
      - package: SwiftCrypto
        product: Crypto
      - sdk: FSKit.framework
      - sdk: Network.framework
      - sdk: Security.framework
      - target: GhostHTTP3Framework
      - framework: GhostHTTP3/.build/artifacts/GhostHTTP3.framework
        embed: true
        codeSign: true
      - target: GhostFileFS
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_NAME: GhostFile
        PRODUCT_BUNDLE_IDENTIFIER: org.ghostvm.ghostfile
        SKIP_INSTALL: NO
        INFOPLIST_FILE: GhostFile/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: GhostFile/entitlements.plist
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "5.0"
        SWIFT_EMIT_LOC_STRINGS: NO
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
      configs:
        Debug:
          ONLY_ACTIVE_ARCH: YES

  GhostFileTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: GhostFileTests
    dependencies:
      - target: GhostFile
      - package: GhostHTTP
      - target: GhostHTTP3Framework
      - framework: GhostHTTP3/.build/artifacts/GhostHTTP3.framework
        link: true
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.ghostvm.ghostfile.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@loader_path/../../../../../Frameworks"
          - "@loader_path/Frameworks"

  GhostVMKit:
    type: framework
    platform: macOS
    sources:
      - path: GhostVMKit
    dependencies:
      - package: GhostHTTP
    settings:
      base:
        PRODUCT_NAME: GhostVMKit
        PRODUCT_BUNDLE_IDENTIFIER: org.ghostvm.ghostvmkit
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SWIFT_VERSION: "5.0"
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
          - "@loader_path/../Frameworks"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        ENABLE_HARDENED_RUNTIME: YES

  vmctl:
    type: application
    platform: macOS
    sources:
      - path: GhostVM/vmctl
        excludes:
          - "CEditLine"
    dependencies:
      - target: GhostVMKit
        link: true
        embed: true
      - package: GhostHTTP
    settings:
      base:
        PRODUCT_NAME: vmctl
        PRODUCT_BUNDLE_IDENTIFIER: org.ghostvm.vmctl
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSBackgroundOnly: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_ENTITLEMENTS: GhostVM/vmctl/entitlements.plist
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/GhostVM/vmctl/CEditLine"
        OTHER_LDFLAGS:
          - "-ledit"
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
          - "@executable_path"

  GhostVMHelper:
    type: application
    platform: macOS
    sources:
      - path: GhostVMHelper
        excludes:
          - "*.template.plist"
      - path: GhostVM/Services
      - path: GhostVM/Resources/VMIcons
        type: resource
        buildPhase: resources
      - path: ../Resources
        type: resource
        buildPhase: resources
    dependencies:
      - target: GhostVMKit
        embed: true
      - package: GhostHTTP
      - target: GhostVMContainerRuntime
        embed: true
        codeSign: true
      - target: GhostVMImageFetch
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    settings:
      base:
        PRODUCT_NAME: GhostVMHelper
        PRODUCT_BUNDLE_IDENTIFIER: org.ghostvm.ghostvm.helper
        SKIP_INSTALL: YES
        INFOPLIST_FILE: ../build/generated-plists/GhostVMHelper-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        CODE_SIGN_ENTITLEMENTS: GhostVMHelper/entitlements.plist
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        ENABLE_HARDENED_RUNTIME: YES
        EMBEDDED_CONTENT_CONTAINS_SWIFT: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
    postBuildScripts:
      - name: Embed Container Helper Swift Libraries
        basedOnDependencyAnalysis: false
        script: |
          SWIFT_STDLIB_TOOL="${TOOLCHAIN_DIR}/usr/bin/swift-stdlib-tool"
          RUNTIME="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/XPCServices/ghostvm-container-runtime.xpc/Contents/MacOS/ghostvm-container-runtime"
          FETCHER="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers/ghostvm-image-fetch"
          FRAMEWORKS="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Frameworks"
          mkdir -p "${FRAMEWORKS}"
          for CANDIDATE in "${TOOLCHAIN_DIR}"/usr/lib/swift-*/macosx; do
            if [ -f "${CANDIDATE}/libswiftCompatibilitySpan.dylib" ]; then
              SWIFT_LIBS="${CANDIDATE}"
            fi
          done
          test -n "${SWIFT_LIBS:-}"
          if [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]; then
            "${SWIFT_STDLIB_TOOL}" --copy --scan-executable "${RUNTIME}" --scan-executable "${FETCHER}" --platform "${PLATFORM_NAME}" --source-libraries "${SWIFT_LIBS}" --destination "${FRAMEWORKS}" --sign "${EXPANDED_CODE_SIGN_IDENTITY}"
          else
            "${SWIFT_STDLIB_TOOL}" --copy --scan-executable "${RUNTIME}" --scan-executable "${FETCHER}" --platform "${PLATFORM_NAME}" --source-libraries "${SWIFT_LIBS}" --destination "${FRAMEWORKS}"
          fi
          rm -f "${FRAMEWORKS}/libswiftCompatibilitySpan.dylib.original"

  GhostVMContainerRuntime:
    type: xpc-service
    platform: macOS
    sources:
      - path: GhostVMContainerRuntime
        excludes:
          - "Info.plist"
          - "entitlements.plist"
    dependencies:
      - target: GhostVMKit
        link: true
        embed: false
      - package: Containerization
        product: Containerization
      - package: Containerization
        product: ContainerizationOCI
      - package: Containerization
        product: ContainerizationOS
      - package: Containerization
        product: ContainerizationExtras
    settings:
      base:
        PRODUCT_NAME: ghostvm-container-runtime
        # Provisioning constraint: the runtime reuses the helper's
        # org.ghostvm.ghostvm.helper application identifier / vmnet Developer ID
        # provisioning profile (already authorized) as a deliberate duplicate
        # identity for this testable DMG. Do not change without a new profile.
        PRODUCT_BUNDLE_IDENTIFIER: org.ghostvm.ghostvm.helper
        SKIP_INSTALL: YES
        INFOPLIST_FILE: GhostVMContainerRuntime/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "6.0"
        CODE_SIGN_ENTITLEMENTS: GhostVMContainerRuntime/entitlements.plist
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        ENABLE_HARDENED_RUNTIME: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
          - "@executable_path/../../../../Frameworks"

  GhostVMImageFetch:
    type: tool
    platform: macOS
    sources:
      - path: GhostVMImageFetch
    dependencies:
      - package: Containerization
        product: Containerization
      - package: Containerization
        product: ContainerizationArchive
      - package: Containerization
        product: ContainerizationExtras
      - package: Containerization
        product: ContainerizationOCI
    settings:
      base:
        PRODUCT_NAME: ghostvm-image-fetch
        PRODUCT_BUNDLE_IDENTIFIER: org.ghostvm.image-fetch
        SKIP_INSTALL: YES
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        ENABLE_HARDENED_RUNTIME: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/Frameworks"
          - "@executable_path/../Frameworks"

  GhostVMFS:
    type: extensionkit-extension
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: GhostVMFS
        excludes:
          - "*.plist"
    dependencies:
      - sdk: FSKit.framework
      - sdk: ExtensionFoundation.framework
    settings:
      base:
        PRODUCT_NAME: GhostVMFS
        PRODUCT_BUNDLE_IDENTIFIER: org.ghostvm.ghostvm.fs
        SKIP_INSTALL: YES
        INFOPLIST_FILE: ../build/generated-plists/GhostVMFS-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: GhostVMFS/entitlements.plist
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "5.0"

  GhostVM:
    type: application
    platform: macOS
    sources:
      - path: GhostVM
        excludes:
          - "vmctl"
          - "vmctl.swift"
          - "*.plist"
    resources:
      - path: build/xcode/GhostTools.dmg
        optional: true
    dependencies:
      - target: GhostVMKit
        embed: true
      - package: GhostHTTP
      - target: vmctl
        embed: true
        codeSign: true
        copy:
          destination: plugins
          subpath: Helpers
      - target: GhostVMHelper
        embed: true
        codeSign: true
        copy:
          destination: plugins
          subpath: Helpers
      - target: GhostVMFS
        embed: true
        codeSign: true
      - package: Sparkle
    settings:
      base:
        PRODUCT_NAME: GhostVM
        PRODUCT_BUNDLE_IDENTIFIER: org.ghostvm.ghostvm
        SKIP_INSTALL: NO
        INFOPLIST_FILE: ../build/generated-plists/GhostVM-Info.plist
        CODE_SIGN_ENTITLEMENTS: GhostVM/entitlements.plist
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        SWIFT_EMIT_LOC_STRINGS: NO
        SWIFT_VERSION: "5.0"
      configs:
        Debug:
          ONLY_ACTIVE_ARCH: YES

  GhostVMTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: GhostVMTests
    dependencies:
      - target: GhostVMKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.ghostvm.ghostvm.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"

  GhostVMUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: GhostVMUITests
    dependencies:
      - target: GhostVM
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.ghostvm.ghostvm.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        ENABLE_APP_SANDBOX: NO

  GhostVMHelperTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: GhostVMHelperTests
      - path: GhostVMHelper/PopoverManager.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.ghostvm.ghostvm.helper.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"

  GhostVMHelperUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: GhostVMHelperUITests
    dependencies:
      - target: GhostVMHelper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.ghostvm.ghostvm.helper.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        ENABLE_APP_SANDBOX: NO
